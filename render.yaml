services:
  - type: web
    name: medicinal-plants-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: models-disk
      mountPath: /opt/render/project/src/models
      sizeGB: 2